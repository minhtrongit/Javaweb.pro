/* ===== CARD PRO UI ===== */
.card{
  background:rgba(255,255,255,0.9);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;

  backdrop-filter:blur(10px);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.4);

  transition:all 0.35s ease;
  position:relative;
}

/* hover nổi 3D */
.card:hover{
  transform:translateY(-12px) scale(1.02);
  box-shadow:
    0 25px 50px rgba(0,0,0,0.25),
    0 0 20px rgba(34,197,94,0.4);
}

/* viền glow nhẹ */
.card::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:18px;
  padding:1px;

  background:linear-gradient(135deg,#22c55e,transparent,#0ea5e9);
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;

  opacity:0;
  transition:0.3s;
}

.card:hover::before{
  opacity:1;
}

/* ===== IMAGE ===== */
.img-wrap{
  width:100%;
  aspect-ratio:3/2;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(180deg,#f8fafc,#e0f2fe);
  overflow:hidden;
}

.img-wrap img{
  max-width:90%;
  max-height:90%;
  object-fit:contain;

  transition:0.4s ease;
}

/* zoom ảnh */
.card:hover img{
  transform:scale(1.1);
}

/* ===== TITLE ===== */
.card h3{
  text-align:center;
  padding:16px;
  font-weight:600;
  font-size:16px;

  background: linear-gradient(270deg,#0ea5e9,#22c55e);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  transition:0.3s;
}

/* hover đổi màu */
.card:hover h3{
  transform:scale(1.05);
}

.card{
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 0.6s ease forwards;
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);

}

/* ===== FIX DETAIL IMAGE ===== */

/* SLIDER */
.slider{
  width:100%;
  aspect-ratio:16/3;
  position:relative;
  overflow:hidden;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:60px;
  box-sizing:border-box;

  opacity:0;
  transition:1s;
  cursor:pointer;
  overflow:hidden;
}

.slide.active{opacity:1}

/* nền blur 3D */
.slide img.bg-blur{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(40px);
  transform:scale(1.2);
  z-index:0;
}

/* ảnh chính */
.slide img.bg-main{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
}

/* overlay */
.slide::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to right,rgba(0,0,0,0.2),transparent);
  z-index:2;
}

.slide-content{
  position:relative;
  z-index:2;
  color:#fff;
  max-width:500px;
  opacity:0;
  transform:translateY(30px);
  transition:all 0.8s ease;
}


.slide.active .slide-content{
  opacity:1;
  transform:translateY(0);
}

  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.slide-btn:hover{

const slider=document.getElementById('slider');
const dotsContainer=slider.querySelector('.dots');
let index=0;

// tạo slide từ software
softwares.forEach((s,i)=>{
  const slide=document.createElement('div');
  slide.className='slide';
  if(i===0) slide.classList.add('active');
slide.innerHTML = `
  <!-- nền blur -->
  <img src="${s.img}" class="bg-blur" width="1600" height="300" alt="">

  <!-- ảnh chính -->
  <img src="${s.img}" class="bg-main" width="1600" height="300" alt="${s.name}">

  <!-- nội dung -->
  <div class="slide-content">
    <h2>${s.name}</h2>
    <p>${s.desc}</p>
    <button class="slide-btn" onclick="event.stopPropagation(); window.open('${s.download}')">
      ⬇ Download Now
    </button>
  </div>
`;

slide.onclick = () => show(i);
  slider.appendChild(slide);

  const dot=document.createElement('div');
  dot.className='dot'+(i===0?' active':'');
  dot.onclick=()=>goToSlide(i);
  dotsContainer.appendChild(dot);
});

const slides=document.querySelectorAll('.slide');

function updateSlider(){
  slides.forEach(s=>{
    s.classList.remove('active');
  });

  document.querySelectorAll('.dot').forEach(d=>{
    d.classList.remove('active');
  });

  slides[index].classList.add('active');
  document.querySelectorAll('.dot')[index].classList.add('active');
}

function nextSlide(){index=(index+1)%slides.length;updateSlider()}
function prevSlide(){index=(index-1+slides.length)%slides.length;updateSlider()}
function goToSlide(i){index=i;updateSlider()}
setInterval(nextSlide,4000);

const detail=document.getElementById('detail');

  home.innerHTML='';
  softwares.forEach((s,i)=>{
    home.innerHTML+=`<div class="card" onclick="show(${i})">
      <div class="img-wrap"><img src="${s.img}" width="400" height="267" loading="lazy" alt="${s.name}"></div>
      <h3>${s.name}</h3>
    </div>`;
  });
}

  const s=softwares[i];
  home.style.display='none';
  detail.style.display='block';
  detail.innerHTML=`

  <h2>${s.name}</h2>
  <img src="${s.img}" width="700" height="467" alt="${s.name}">

  <div class="video-box" onclick="playVideo('${s.video}')">

    <div class="play-btn">▶</div>
  </div>
  <br><br>
  <button class="btn" onclick="window.open('${s.download}')">Download</button>
  `;
}

function back(){detail.style.display='none';home.style.display='grid'}

render();
function getEmbed(url){
  if(url.includes("youtube.com") || url.includes("youtu.be")){
    let id = url.split("v=")[1] || url.split("/").pop();
    return "https://www.youtube.com/embed/" + id;
  }
  return null;
}

function getThumbnail(url){
  if(url.includes("youtube")){
    let id = url.split("v=")[1] || url.split("/").pop();
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  }
  return "images/1.MergerSplitterExcel.webp";
}

function playVideo(url){
  const embed = getEmbed(url);

  if(embed){
    document.getElementById('videoFrame').src = embed;
    document.getElementById('modal').classList.add('active');
  }else{
    window.open(url, '_blank');
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.getElementById('videoFrame').src="";
}

  databaseURL: "https://javawebpro-e0a9a-default-rtdb.firebaseio.com",
  projectId: "javawebpro-e0a9a",
};

(function initVisitStats(){
  if(firebaseConfig.apiKey === "YOUR_API_KEY"){
    console.warn("⚠️ Chưa cấu hình firebaseConfig cho thống kê truy cập — xem hướng dẫn phía trên trong index.html.");
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Đếm tổng lượt truy cập: chỉ +1 mỗi phiên trình duyệt (session), tránh đếm trùng khi chuyển trang
    if(!sessionStorage.getItem("gonn_visited_session")){
      sessionStorage.setItem("gonn_visited_session", "1");
      db.ref("stats/totalVisits").transaction((cur) => (cur || 0) + 1);
    }

    // Đếm số người đang online: mỗi tab mở là 1 node, tự xoá khi đóng tab/mất kết nối
    const presenceRef = db.ref("stats/onlineUsers").push();
    presenceRef.set(true);
    presenceRef.onDisconnect().remove();
    window.addEventListener("beforeunload", () => presenceRef.remove());

    const elTotal = document.getElementById("statTotalVisits");
    const elOnline = document.getElementById("statOnlineNow");

    db.ref("stats/totalVisits").on("value", (snap) => {
      if(elTotal) elTotal.textContent = (snap.val() || 0).toLocaleString("vi-VN");
    });

    db.ref("stats/onlineUsers").on("value", (snap) => {
      const count = snap.exists() ? Object.keys(snap.val() || {}).length : 0;
      if(elOnline) elOnline.textContent = count.toLocaleString("vi-VN");
    });
  }catch(err){
    console.warn("Không khởi tạo được thống kê truy cập:", err);
  }
})();

if ("serviceWorker" in navigator) {
  // Khi SW mới chiếm quyền điều khiển (sau khi cập nhật), tự tải lại trang
  // 1 lần để người dùng thấy ngay bản mới, không cần xoá cache/lịch sử.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });

  navigator.serviceWorker.register("sw.js")
    .then((reg) => {
      console.log("✅ App Ready");
      // Chủ động kiểm tra bản cập nhật mỗi khi mở lại trang
      reg.update();
    })
    .catch(err => console.log("SW lỗi:", err));
}
</script>
