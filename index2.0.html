<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Pro Store</title>

<style>
body{margin:0;font-family:Inter,Arial;background:#f4f6fb}

/* ===== HEADER PRO (THÊM) ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f172a;
  padding:12px 20px;
  color:#fff;
}

.logo-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-box img{
  height:45px;
  border-radius:10px;

  /* hiệu ứng glow */
  box-shadow:
    0 0 10px #00eaff,
    0 0 20px #00eaff,
    0 0 40px #00eaff;

  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{
    box-shadow:
      0 0 5px #00eaff,
      0 0 10px #00eaff;
  }
  to{
    box-shadow:
      0 0 20px #00eaff,
      0 0 40px #00eaff,
      0 0 60px #00eaff;
  }
}

.logo-text{
  font-size:20px;
  font-weight:bold;
}

.menu a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-weight:500;
}

.menu a:hover{
  color:#22c55e;
}

.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  border:none;
  color:#fff;
  font-size:28px;
  padding:12px 18px;
  cursor:pointer;
  z-index:20;
  border-radius:8px;
  backdrop-filter:blur(6px);
  transition:0.3s;
}

.nav-btn:hover{
  background:rgba(0,0,0,0.8);
}

.prev{left:15px}
.next{right:15px}

/* ===== GIỮ NGUYÊN HEADER CŨ ===== */


/* SLIDER */
.slider{
  width:100%;
  aspect-ratio:16/6;
  position:relative;
  overflow:hidden;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:60px;
  box-sizing:border-box;

  opacity:0;
  transition:1s;
  cursor:pointer;
  overflow:hidden;
}

.slide.active{opacity:1}

/* nền blur 3D */
.slide img.bg-blur{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(40px);
  transform:scale(1.2);
  z-index:0;
}

/* ảnh chính */
.slide img.bg-main{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
}

/* overlay */
.slide::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to right,rgba(0,0,0,0.2),transparent);
  z-index:2;
}

.slide-content{
  position:relative;
  z-index:2;
  color:#fff;
  max-width:500px;
  opacity:0;
  transform:translateY(30px);
  transition:all 0.8s ease;
}

.slide.active .slide-content{
  opacity:1;
  transform:translateY(0);
}

.slide-btn{
  padding:14px 30px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  border:none;
  color:#fff;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.slide-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

/* GRID */
.container{display:grid;gap:28px;padding:32px}
@media(min-width:1400px){.container{grid-template-columns:repeat(4,1fr)}}
@media(min-width:992px) and (max-width:1399px){.container{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px) and (max-width:991px){.container{grid-template-columns:repeat(2,1fr)}}
@media(max-width:599px){.container{grid-template-columns:1fr}}

.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,0.08);transition:.35s}
.card:hover{transform:translateY(-10px);box-shadow:0 20px 40px rgba(0,0,0,0.15)}

.img-wrap{
  aspect-ratio:3/2;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f8fafc,#eef2ff);
}
.img-wrap img{max-width:90%;max-height:90%}

/* DETAIL */
.detail{display:none;padding:40px;text-align:center}

/* ===== FOOTER PRO (THÊM) ===== */
.footer{
  background:#0f172a;
  color:#fff;
  padding:30px;
  text-align:center;
  margin-top:40px;
  line-height:1.8;
}

.footer strong{
  color:#22c55e;
}

/* MOBILE */
@media (max-width: 1024px){
  .slide-content{display:none}
  .slide{padding:20px;justify-content:center}
}

</style>
</head>

<body>

<!-- HEADER MỚI -->
<div class="topbar">
  <div class="logo-box">
    <img src="logo.png">
    <div class="logo-text">Software Pro Store</div>
  </div>

  <div class="menu">
    <a href="#">Trang chủ</a>
    <a href="#">Giới thiệu</a>
    <a href="#">Liên hệ</a>
  </div>
</div>



<!-- SLIDER -->
<div class="slider" id="slider">
  <button class="nav-btn prev" onclick="prevSlide()">❮</button>
  <button class="nav-btn next" onclick="nextSlide()">❯</button>
  <div class="dots"></div>
</div>

<div id="home" class="container"></div>
<div id="detail" class="detail"></div>

<!-- FOOTER -->
<div class="footer">
  📞 Hotline: <strong>0947999665</strong><br>
  📧 Email: <strong>minhtrongit@gmail.com</strong><br>
  © Copyright javaweb.pro
</div>

<!-- ===== JS GIỮ NGUYÊN ===== -->
<script>
const softwares = [
  {name:"Mail Merge", img:"images/1.MergerSplitterExcel.png", desc:"Send personalized emails automatically.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"SendMail Auto", img:"images/10.SenMail.png", desc:"Automate bulk email sending.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"Merge All To PDF", img:"images/10.MergeAllPdf.png", desc:"Merge all files into one PDF.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"PDF Splitter", img:"images/4.TachPdf.png", desc:"Split PDF into multiple files.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"ZipFile Pro", img:"images/7.NenFileZip.png", desc:"Compress files efficiently.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"Convert Size Image", img:"images/21.ConvertSizeImage.png", desc:"Reduce image size without losing quality.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"Bulk Rename", img:"images/46.RenameFileBulkRename.png", desc:"Rename files in bulk.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"Secure Folder Enterprise", img:"images/49.Baomatthumuc_SecureFolderEnterprise.png", desc:"Protect folders with password.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"QR Scan Bank", img:"images/53.QrScanBank.png", desc:"Generate bulk QR payment codes.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"},
  {name:"Change Json To Excel", img:"images/54.ChangeJsonToExcel.png", desc:"Convert JSON to Excel easily.", video:"https://vt.tiktok.com/ZSHVphFbp/", download:"https://drive.google.com/drive/folders/1o4QK_TVy6tAab7CW_XL4SGUc3Zg1Phe1?usp=sharing"}
];

const slider=document.getElementById('slider');
const dotsContainer=slider.querySelector('.dots');
let index=0;

// tạo slide từ software
softwares.forEach((s,i)=>{
  const slide=document.createElement('div');
  slide.className='slide';
  if(i===0) slide.classList.add('active');
slide.innerHTML = `
  <!-- nền blur -->
  <img src="${s.img}" class="bg-blur">

  <!-- ảnh chính -->
  <img src="${s.img}" class="bg-main">

  <!-- nội dung -->
  <div class="slide-content">
    <h2>${s.name}</h2>
    <p>${s.desc}</p>
    <button class="slide-btn" onclick="event.stopPropagation(); window.open('${s.download}')">
      ⬇ Download Now
    </button>
  </div>
`;

slide.onclick = () => show(i);
  slider.appendChild(slide);

  const dot=document.createElement('div');
  dot.className='dot'+(i===0?' active':'');
  dot.onclick=()=>goToSlide(i);
  dotsContainer.appendChild(dot);
});

const slides=document.querySelectorAll('.slide');

function updateSlider(){
  slides.forEach(s=>{
    s.classList.remove('active');
  });

  document.querySelectorAll('.dot').forEach(d=>{
    d.classList.remove('active');
  });

  slides[index].classList.add('active');
  document.querySelectorAll('.dot')[index].classList.add('active');
}

function nextSlide(){index=(index+1)%slides.length;updateSlider()}
function prevSlide(){index=(index-1+slides.length)%slides.length;updateSlider()}
function goToSlide(i){index=i;updateSlider()}
setInterval(nextSlide,4000);

// GRID
const home=document.getElementById('home');
const detail=document.getElementById('detail');

function render(){
  home.innerHTML='';
  softwares.forEach((s,i)=>{
    home.innerHTML+=`<div class="card" onclick="show(${i})">
      <div class="img-wrap"><img src="${s.img}"></div>
      <h3>${s.name}</h3>
    </div>`;
  });
}

function show(i){
  const s=softwares[i];
  home.style.display='none';
  detail.style.display='block';
  detail.innerHTML=`
  <div class="back" onclick="back()">← Back</div>
  <h2>${s.name}</h2>
  <img src="${s.img}">
  <p>${s.desc}</p>
  <div class="screenshots">
    <img src="${s.img}"><img src="${s.img}"><img src="${s.img}">
  </div>
  <div class="video-box" onclick="playVideo('${s.video}')">
    <img src="${getThumbnail(s.video)}">
    <div class="play-btn">▶</div>
  </div>
  <br><br>
  <button class="btn" onclick="window.open('${s.download}')">Download</button>
  `;
}

function back(){detail.style.display='none';home.style.display='grid'}

render();
function getEmbed(url){
  if(url.includes("youtube.com") || url.includes("youtu.be")){
    let id = url.split("v=")[1] || url.split("/").pop();
    return "https://www.youtube.com/embed/" + id;
  }
  return null;
}

function getThumbnail(url){
  if(url.includes("youtube")){
    let id = url.split("v=")[1] || url.split("/").pop();
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  }
  return "images/1.MergerSplitterExcel.png";
}

function playVideo(url){
  const embed = getEmbed(url);

  if(embed){
    document.getElementById('videoFrame').src = embed;
    document.getElementById('modal').classList.add('active');
  }else{
    window.open(url, '_blank');
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.getElementById('videoFrame').src="";
}
</script>

<div id="modal" class="modal" onclick="closeModal()">
  <iframe id="videoFrame" src="" allowfullscreen></iframe>
</div>

</body>
</html>
